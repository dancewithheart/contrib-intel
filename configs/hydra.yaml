repo: hydra
owner: cardano-scaling
name: hydra

paths:
  local_repo: ~/src/hydra
  data_dir: data/hydra
  report_path: reports/hydra-opportunities.md

github:
  per_page: 100
  max_issues: 250
  max_prs: 250
  use_cache: true
  max_issue_context: 20

issue_queries:
  state: open
  labels_include: []
  labels_exclude:
    - question

keywords:
  subsystems:
    networking:
      - "network"
      - "connection"
      - "websocket"
      - "peer"
      - "Node"
      - "Blockfrost"
    protocol:
      - "head"
      - "snapshot"
      - "fanout"
      - "contest"
      - "close"
      - "protocol"
    hydra_node:
      - "hydra-node"
      - "HydraNode"
      - "event log"
      - "crash"
      - "restart"
    hydraw:
      - "hydraw"
      - "cli"
      - "command"
      - "ux"
      - "event log"
    tests:
      - "property"
      - "QuickCheck"
      - "model"
      - "integration"
      - "golden"
      - "smoke test"

  grep_patterns:
    - "TODO"
    - "FIXME"
    - "XXX"
    - "HACK"
    - "should not happen"
    - "work around"
    - "re-enable"
    - "broken"
    - "flaky"

filters:
  include_paths:
    - "hydra-node/src/"
    - "hydra-node/test/"
    - "hydra-tui/src/"
    - "hydraw/src/"
    - "hydraw/test/"
  exclude_paths:
    - "dist-newstyle/"
    - ".stack-work/"
    - "docs/"
    - "demo/"
  exclude_file_names: []
  exclude_suffixes:
    - ".log"

context_rules:
  maintainer_handles:
    - "abailly"
    - "muesli"
    - "fjakobs"
    - "arnau"
  maintainer_hint_phrases:
    - "we should"
    - "would be nice"
    - "follow-up"
    - "good first issue"
    - "another instance of"
    - "it would be sensible"
  dormant_days_threshold: 120
  context_scoring:
    same_repo_pr_penalty: 4.0
    external_reference_bonus: 3.0
    maintainer_hint_bonus: 4.0
    dormant_bonus: 2.0

scoring:
  issue_match: 3.0
  repo_signal: 2.0
  churn: 1.5
  bugfix_churn: 2.5
  dormant_bonus: 2.0
  personal_interest_bonus: 1.5

ranking_rules:
  boost_if_comment_mentions:
    - "regression"
    - "user impact"
    - "flaky"
    - "crash"
