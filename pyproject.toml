[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "contrib-intel"
version = "0.1.0"
description = "Heuristic ranking of open-source contribution opportunities"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.11",
    "pandas>=3.0",
]
dev = [
    "mypy>=2.3",
    "pytest>=9.1",
    "ruff>=0.16",
    "types-PyYAML>=6.0",
]

[tool.setuptools]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
