[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "contrib-intel"
version = "0.1.0"
description = "Heuristic ranking of open-source contribution opportunities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.9,<4",
    "pandas>=2.2,<3",
]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
    "types-PyYAML>=6.0.12",
]

[tool.setuptools]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
